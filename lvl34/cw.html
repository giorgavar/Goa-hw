<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div {
            color: white;
            background-color: black;
            text-align: center;
            font-size: 20px;
        }
        /* descendant selector - ესს არის css სელექტორი რომელიც საშუალებას გვაძლევს შევარჩიოთ ელემენტები რომლებბიც მდებარეობს სხვა ელემენტების შიგნით */

        p b {
            color: red;
        }
    </style>
</head>
<body>
    <div>
        <p>this is a paragraph <b>GOA</b> inside the div</p>
        <h1>this is a heading inside the div</h1>
        <button>click me</button>
    </div>
</body>
</html>

<!-- 1) შექმენით div სადაც შეინახავთ 3 ელემენტს p, h1, და button, დაწერეთ css წესი, რომელიც შეცვლის ტექსტის ფერებს დივში, დივის უკანა ფერის ფონს, ტექტებს გადაიტანთ ცენტრში და გაადიდებთ font ზომას



2) ახსენით კომენტარით თუ როგორ მუშაობს descendant selector და გააკეთეთ ერთი მაგალითი, ჩანესტეთ p თეგში bold თეგი და შეცვალეთ მხოლოდ ამ bold თეგის ფერი -->
