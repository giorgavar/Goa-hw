<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <body>
      <form id="f2" novalidate>
        <h2>რეგისტრაცია</h2>
        <input type="text" id="username2" placeholder="UserName" />
        <button type="submit">Submit</button>
        <p class="msg" id="err2"></p>
      </form>

      <form id="f3" novalidate>
        <h2>პაროლი</h2>
        <input type="password" id="pass3" placeholder="Password" />
        <input type="password" id="confirm3" placeholder="Confirm Password" />
        <button type="submit">Submit</button>
        <p class="msg" id="err3"></p>
      </form>

      <form id="f4" novalidate>
        <h2>კონტაქტი</h2>
        <input type="text" id="email4" placeholder="Email" />
        <input type="text" id="age4" placeholder="Age" />
        <input type="text" id="phone4" placeholder="Phone" />
        <button type="submit">Submit</button>
        <p class="msg" id="err4"></p>
      </form>

      <form id="f5" novalidate>
        <h2>სახელი და გვარი</h2>
        <input type="text" id="first5" placeholder="FirstName" />
        <input type="text" id="last5" placeholder="LastName" />
        <button type="submit">Submit</button>
        <p class="msg" id="err5"></p>
      </form>

      <script src="script.js"></script>
    </body>
  </body>
</html>
